  name = "cadmospayrecovery"
  main = "worker.js"
  compatibility_date = "2026-02-06"

  [build]
  command = "npm run build:frontend"
  watch_dir = ["frontend", "shared", "scripts"]

  [assets]
  directory = "./dist"
  binding = "ASSETS"
  # Without this, Cloudflare serves matching assets directly and worker.js only runs on
  # the not-found path, publishing the recovery page without its security headers.
  run_worker_first = true
